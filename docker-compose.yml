services:
  mysql:
    image: mysql:8.0.30
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vben_prod}
      MYSQL_USER: ${MYSQL_USERNAME:-vben}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_app}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT_HOST:-13306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: apps/backend-mock/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 5320
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-please_change_me_access}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-please_change_me_refresh}
      GINGER_API_BASE_URL: ${GINGER_API_BASE_URL:-http://host.docker.internal:5001}
      GINGER_SERVICE_TOKEN: ${GINGER_SERVICE_TOKEN:-}
      MX_SIGN_SALT: ${MX_SIGN_SALT:-mx-custom-v1}
      MX_MAX_CLOCK_SKEW_MS: ${MX_MAX_CLOCK_SKEW_MS:-600000}
      MX_NONCE_TTL_MS: ${MX_NONCE_TTL_MS:-600000}
      RBAC_DB_FILE: /data/rbac.sqlite
      MYSQL_URL: ${MYSQL_URL:-mysql://vben:change_me_app@mysql:3306/vben_prod?charset=utf8mb4}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vben_prod}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-vben}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_app}
      MYSQL_SSL: ${MYSQL_SSL:-false}
      MYSQL_CHARSET: ${MYSQL_CHARSET:-utf8mb4}
    volumes:
      - backend-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: apps/web-antd/Dockerfile
      args:
        VITE_BASE: ${VITE_BASE:-/}
        VITE_GLOB_API_URL: /api
        VITE_GINGER_API_URL: /api/ginger
        VITE_MX_SIGN_SALT: ${MX_SIGN_SALT:-mx-custom-v1}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5666}:80"

volumes:
  backend-data:
  mysql-data:
